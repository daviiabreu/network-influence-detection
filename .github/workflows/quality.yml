name: quality

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: studies/ic-2026-2027/uv.lock
      - name: Install
        working-directory: studies/ic-2026-2027
        run: uv sync --locked --group dev
      - name: Structure
        working-directory: studies/ic-2026-2027
        run: uv run --locked python ../../scripts/check_repository.py
      - name: Shell syntax
        run: bash -n scripts/build_and_smoke.sh && shellcheck scripts/build_and_smoke.sh
      - name: Format and lint
        working-directory: studies/ic-2026-2027
        run: uv run --locked ruff format --check . ../../scripts && uv run --locked ruff check . ../../scripts
      - name: Type-check
        working-directory: studies/ic-2026-2027
        run: MYPYPATH=src:experiments:publications/jcss-journal uv run --locked mypy --explicit-package-bases src tests ../../scripts experiments/exploratory/detection-boundary-v4/release_on_completion.py experiments/exploratory/detection-boundary-v4/report/release_handoff.py experiments/exploratory/detection-boundary-v4/report/rehearse_release_handoff.py publications/jcss-journal/toolchain.py publications/jcss-journal/build.py publications/jcss-journal/package.py
      - name: Hermetic tests
        working-directory: studies/ic-2026-2027
        run: uv run --locked python ../../scripts/test_hermetic.py
      - name: Build and smoke-test wheel
        run: ./scripts/build_and_smoke.sh uv
